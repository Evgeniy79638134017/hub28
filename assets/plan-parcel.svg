<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1040" role="img"
     aria-labelledby="ttl desc" font-family="Inter, Arial, sans-serif">
<title id="ttl">План земельного участка 28:14:010311:1, 11,07 га</title>
<desc id="desc">Контур участка снят с космоснимка, площадь по данным реестра — 110 652 квадратных метра.
Габариты около 695 на 195 метров, периметр около 1910 метров. Участок вытянут вдоль полосы отвода железнодорожной
линии Благовещенск — Белогорск, станция примыкания Среднебелая. Внутри участка железнодорожный путь 700 метров
в собственности. Застроено около 11 процентов площади.</desc>
<defs>
  <pattern id="grid" width="111.69" height="111.69" patternUnits="userSpaceOnUse">
    <path d="M 111.69 0 L 0 0 0 111.69" fill="none" stroke="#2B3E5E" stroke-width="1.1"/>
  </pattern>
  <pattern id="rw" width="13" height="13" patternTransform="rotate(-49.7)" patternUnits="userSpaceOnUse">
    <rect width="13" height="13" fill="#16223A"/>
    <line x1="0" y1="0" x2="0" y2="13" stroke="#2C3E5E" stroke-width="3"/>
  </pattern>
  <clipPath id="frame"><rect x="70" y="150" width="830" height="760"/></clipPath>
  <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
    <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#26A69A"/>
  </marker>
  <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M 5 1 L 5 9" stroke="#8BA0BF" stroke-width="2"/>
  </marker>
</defs>

<rect width="1440" height="1040" fill="#0B1220"/>
<text x="70" y="72" font-size="33" font-weight="700" fill="#FFFFFF">План участка 28:14:010311:1</text>
<text x="70" y="106" font-size="18.5" fill="#8BA0BF">Амурская область, с. Среднебелая, ул. Папулова, 46 · 11,07 га · аренда до 2075 года</text>

<g clip-path="url(#frame)">
  <rect x="70" y="150" width="830" height="760" fill="url(#grid)" opacity=".6"/>
  <!-- полоса отвода и главный путь -->
  <line x1="112.0" y1="735.4" x2="572.5" y2="192.0" stroke="url(#rw)" stroke-width="56"/>
  <line x1="112.0" y1="735.4" x2="572.5" y2="192.0" stroke="#C9D3E2" stroke-width="3"/>
  <line x1="112.0" y1="735.4" x2="572.5" y2="192.0" stroke="#0B1220" stroke-width="1.2" stroke-dasharray="8 8"/>

  <!-- участок -->
  <polygon points="746.0,225.0 654.8,235.2 510.5,348.4 183.8,697.1 196.1,771.2 280.3,832.3 302.9,824.8 334.5,835.0 467.0,709.5 456.8,691.8 431.6,705.2 439.7,689.1 428.9,673.5 452.0,648.8 445.0,632.2 466.0,611.8 512.6,606.5 578.6,563.5 773.4,355.4 786.2,277.6" fill="#26A69A" fill-opacity="0.13" stroke="#31E0CF" stroke-width="3.4"
           stroke-linejoin="round" filter="url(#glow)"/>

  <!-- собственный путь -->
  <line x1="256.0" y1="703.9" x2="651.8" y2="236.9" stroke="#8BC34A" stroke-width="4" stroke-dasharray="15 9"/>
  <text x="453.9" y="457.4" font-size="16.5" fill="#C2E79B" font-weight="600" text-anchor="middle"
        transform="rotate(-49.7 453.9 470.4)">собственный путь 700 м</text>

  <!-- размерные линии -->
  <g stroke="#8BA0BF" stroke-width="1.5" fill="none">
    <line x1="375.5" y1="896.0" x2="861.3" y2="322.7" marker-start="url(#tick)" marker-end="url(#tick)"/>
    <line x1="754.5" y1="164.0" x2="859.9" y2="253.3" marker-start="url(#tick)" marker-end="url(#tick)"/>
  </g>
  <text x="618.4" y="633.4" font-size="19" fill="#E7EBF4" font-weight="700" text-anchor="middle"
        transform="rotate(-49.7 618.4 633.4)">≈ 695 м</text>
  <text x="837.2" y="208.7" font-size="19" fill="#E7EBF4" font-weight="700" text-anchor="middle"
        transform="rotate(40.3 837.2 208.7)">≈ 195 м</text>

  <!-- станция примыкания -->
  <g>
    <circle cx="155.4" cy="684.2" r="9" fill="#1A237E" stroke="#5C6BC0" stroke-width="3"/>
    <text x="171.4" y="654.2" font-size="17.5" fill="#FFFFFF" font-weight="700">ст. Среднебелая</text>
    <text x="171.4" y="673.2" font-size="14.5" fill="#8BA0BF">станция примыкания</text>
  </g>

  <!-- направления по железной дороге -->
  <g font-size="15.5">
    <text x="98" y="852" fill="#9FE6DD" font-weight="600">сухой порт «Благовещенск» →</text>
    <text x="98" y="874" fill="#6E8AA8">12 км по железной дороге</text>
    <text x="872" y="852" fill="#9FE6DD" font-weight="600" text-anchor="end">← Белогорск, переработка · 60 км</text>
    <text x="872" y="874" fill="#6E8AA8" text-anchor="end">в противоположную сторону по той же линии</text>
  </g>
</g>

<!-- панель параметров -->
<g transform="translate(960,178)">
  <text x="0" y="0" font-size="12.5" fill="#6E8AA8" letter-spacing="1.6">ПАРАМЕТРЫ</text>
  <g>
    <text x="0" y="40" font-size="15.5" fill="#8BA0BF">Площадь по реестру</text>
    <text x="0" y="72" font-size="27" font-weight="700" fill="#FFFFFF">110 652 м²</text>
    <text x="0" y="120" font-size="15.5" fill="#8BA0BF">Габариты</text>
    <text x="0" y="152" font-size="27" font-weight="700" fill="#FFFFFF">≈ 695 × 195 м</text>
    <text x="0" y="200" font-size="15.5" fill="#8BA0BF">Периметр</text>
    <text x="0" y="232" font-size="27" font-weight="700" fill="#FFFFFF">≈ 1910 м</text>
    <text x="0" y="280" font-size="15.5" fill="#8BA0BF">Объекты в собственности</text>
    <text x="0" y="312" font-size="27" font-weight="700" fill="#FFFFFF">14 · 12 286,6 м²</text>
    <text x="0" y="360" font-size="15.5" fill="#8BA0BF">Застроено</text>
    <text x="0" y="392" font-size="27" font-weight="700" fill="#31E0CF">≈ 11 %</text>
    <text x="0" y="420" font-size="14.5" fill="#6E8AA8">свободно под проект ≈ 89 % площади</text>
  </g>
  <g transform="translate(0,468)">
    <line x1="0" y1="0" x2="360" y2="0" stroke="#22304A"/>
    <text x="0" y="34" font-size="12.5" fill="#6E8AA8" letter-spacing="1.6">УСЛОВНЫЕ ОБОЗНАЧЕНИЯ</text>
    <g font-size="15" fill="#8BA0BF">
      <line x1="2" y1="64" x2="44" y2="64" stroke="#31E0CF" stroke-width="3.4"/><text x="60" y="69">граница участка</text>
      <line x1="2" y1="98" x2="44" y2="98" stroke="#8BC34A" stroke-width="4" stroke-dasharray="12 7"/><text x="60" y="103">путь 700 м в собственности</text>
      <rect x="2" y="122" width="42" height="16" fill="url(#rw)" stroke="#243450"/><text x="60" y="135">полоса отвода железной дороги</text>
      <rect x="2" y="156" width="42" height="16" fill="none" stroke="#18263C"/><text x="60" y="169">сетка 100 × 100 м</text>
    </g>
  </g>
</g>

<!-- масштаб и север -->
<g transform="translate(98,944)">
  <line x1="0" y1="0" x2="223.4" y2="0" stroke="#DCE2EA" stroke-width="3"/>
  <line x1="0" y1="-7" x2="0" y2="7" stroke="#DCE2EA" stroke-width="3"/>
  <line x1="223.4" y1="-7" x2="223.4" y2="7" stroke="#DCE2EA" stroke-width="3"/>
  <text x="111.7" y="25" font-size="15" fill="#8BA0BF" text-anchor="middle">200 м</text>
</g>
<g transform="translate(854,940)">
  <circle r="27" fill="none" stroke="#22304A" stroke-width="2"/>
  <path d="M 0 -18 L 7 10 L 0 5 L -7 10 Z" fill="#31E0CF"/>
  <text y="25" font-size="13.5" fill="#8BA0BF" text-anchor="middle">С</text>
</g>

<text x="70" y="1022" font-size="13.5" fill="#5A6E8C">Контур снят с космоснимка, площадь и границы — по данным реестра. Габариты и периметр ориентировочные, уточняются по межевому плану.</text>
</svg>
