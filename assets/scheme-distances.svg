<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" role="img" aria-labelledby="sdTitle sdDesc" font-family="Inter, Arial, sans-serif">
  <title id="sdTitle">Схема расстояний от площадки Среднебелая</title>
  <desc id="sdDesc">Линейная схема: Белогорск в 56 километрах западнее площадки, сухой порт «Благовещенск» в 12 километрах по железной дороге, автомобильный мост Благовещенск — Хэйхэ примерно в 70 километрах, Благовещенск в 75 километрах.</desc>

  <rect width="1400" height="640" fill="#FFFFFF"/>

  <text x="70" y="80" font-size="30" fill="#1A237E" font-weight="700">Положение площадки в логистическом контуре</text>
  <text x="70" y="116" font-size="18" fill="#5B6B7F">с. Среднебелая · линия Благовещенск — Белогорск · Забайкальская железная дорога</text>

  <!-- Ось: железная дорога -->
  <line x1="100" y1="330" x2="1300" y2="330" stroke="#0F1B2D" stroke-width="5"/>
  <g stroke="#0F1B2D" stroke-width="2.5">
    <line x1="130" y1="320" x2="130" y2="340"/><line x1="190" y1="320" x2="190" y2="340"/>
    <line x1="250" y1="320" x2="250" y2="340"/><line x1="310" y1="320" x2="310" y2="340"/>
    <line x1="370" y1="320" x2="370" y2="340"/><line x1="430" y1="320" x2="430" y2="340"/>
    <line x1="490" y1="320" x2="490" y2="340"/><line x1="550" y1="320" x2="550" y2="340"/>
    <line x1="610" y1="320" x2="610" y2="340"/><line x1="670" y1="320" x2="670" y2="340"/>
    <line x1="730" y1="320" x2="730" y2="340"/><line x1="790" y1="320" x2="790" y2="340"/>
    <line x1="850" y1="320" x2="850" y2="340"/><line x1="910" y1="320" x2="910" y2="340"/>
    <line x1="970" y1="320" x2="970" y2="340"/><line x1="1030" y1="320" x2="1030" y2="340"/>
    <line x1="1090" y1="320" x2="1090" y2="340"/><line x1="1150" y1="320" x2="1150" y2="340"/>
    <line x1="1210" y1="320" x2="1210" y2="340"/><line x1="1270" y1="320" x2="1270" y2="340"/>
  </g>

  <!-- Размерные стрелки -->
  <g stroke="#26A69A" stroke-width="2.5" fill="#26A69A">
    <line x1="185" y1="230" x2="640" y2="230"/>
    <path d="M 190 230 l 14 -6 0 12 z"/>
    <path d="M 635 230 l -14 -6 0 12 z"/>
  </g>
  <text x="412" y="216" font-size="19" fill="#1F7A70" text-anchor="middle" font-weight="600">56 км по автодороге</text>

  <g stroke="#26A69A" stroke-width="2.5" fill="#26A69A">
    <line x1="700" y1="230" x2="965" y2="230"/>
    <path d="M 705 230 l 14 -6 0 12 z"/>
    <path d="M 960 230 l -14 -6 0 12 z"/>
  </g>
  <text x="832" y="216" font-size="19" fill="#1F7A70" text-anchor="middle" font-weight="600">12 км по железной дороге</text>

  <!-- Белогорск -->
  <circle cx="180" cy="330" r="16" fill="#1A237E"/>
  <text x="180" y="285" font-size="21" fill="#1A237E" text-anchor="middle" font-weight="700">Белогорск</text>
  <text x="180" y="395" font-size="15.5" fill="#5B6B7F" text-anchor="middle">
    <tspan x="180" dy="0">56 км</tspan>
    <tspan x="180" dy="22">новые перерабатывающие</tspan>
    <tspan x="180" dy="22">мощности</tspan>
  </text>

  <!-- Площадка -->
  <circle cx="670" cy="330" r="24" fill="#8BC34A"/>
  <circle cx="670" cy="330" r="10" fill="#FFFFFF"/>
  <text x="670" y="272" font-size="24" fill="#1A237E" text-anchor="middle" font-weight="700">с. Среднебелая</text>
  <text x="670" y="395" font-size="15.5" fill="#5B6B7F" text-anchor="middle">
    <tspan x="670" dy="0" font-weight="600" fill="#1F7A70">площадка · станция примыкания</tspan>
    <tspan x="670" dy="22">11,07 га · ж/д путь 700 м</tspan>
    <tspan x="670" dy="22">14 объектов · аренда 49 лет</tspan>
  </text>

  <!-- Сухой порт -->
  <circle cx="990" cy="330" r="16" fill="#26A69A"/>
  <text x="990" y="285" font-size="21" fill="#1A237E" text-anchor="middle" font-weight="700">Берёзовский-Восточный</text>
  <text x="990" y="395" font-size="15.5" fill="#5B6B7F" text-anchor="middle">
    <tspan x="990" dy="0">12 км по железной дороге</tspan>
    <tspan x="990" dy="22">сухой порт «Благовещенск»</tspan>
    <tspan x="990" dy="22">контейнерный терминал, запуск 2026</tspan>
  </text>

  <!-- Благовещенск -->
  <circle cx="1270" cy="330" r="16" fill="#1A237E"/>
  <text x="1270" y="285" font-size="21" fill="#1A237E" text-anchor="middle" font-weight="700">Благовещенск</text>
  <text x="1270" y="395" font-size="15.5" fill="#5B6B7F" text-anchor="middle">
    <tspan x="1270" dy="0">75 км по автодороге</tspan>
    <tspan x="1270" dy="22">мост в Хэйхэ — около 70 км</tspan>
    <tspan x="1270" dy="22">пункт пропуска на границе с КНР</tspan>
  </text>

  <text x="700" y="530" font-size="20" fill="#0F1B2D" text-anchor="middle" font-weight="600">Площадка стоит между полем и переработкой — внутри сырьевого контура области.</text>

  <text x="70" y="600" font-size="14" fill="#8A95A5">Расстояния по автомобильным дорогам, кроме отмеченных расстояний по железной дороге. Подлежат уточнению при подготовке проектной документации.</text>
</svg>
