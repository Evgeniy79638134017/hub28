<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="szTitle szDesc" font-family="Inter, Arial, sans-serif">
  <title id="szTitle">Схема ограничений застройки: охранные коридоры линий электропередачи и санитарные разрывы</title>
  <desc id="szDesc">Принципиальная схема: участок вытянут вдоль полосы отвода железной дороги, жилая застройка села примыкает с южной стороны. Показаны санитарные разрывы 50, 100 и 300 метров от жилой застройки и охранный коридор линии электропередачи 10 киловольт шириной 20 метров.</desc>

  <defs>
    <pattern id="zHatch" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#B45309" stroke-width="1.4" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1400" height="760" fill="#FFFFFF"/>

  <text x="70" y="72" font-size="30" fill="#1A237E" font-weight="700">Ограничения застройки: охранные зоны и санитарные разрывы</text>
  <text x="70" y="106" font-size="17" fill="#5B6B7F">Схема принципиальная, не масштабная. Замер фактических расстояний — первое действие при проработке сценария.</text>

  <!-- Санитарные разрывы: дуги от жилой застройки -->
  <g>
    <circle cx="430" cy="720" r="470" fill="#B45309" fill-opacity="0.05" stroke="#B45309" stroke-width="1.5" stroke-dasharray="10 7"/>
    <circle cx="430" cy="720" r="310" fill="#B45309" fill-opacity="0.06" stroke="#B45309" stroke-width="1.5" stroke-dasharray="10 7"/>
    <circle cx="430" cy="720" r="185" fill="#B45309" fill-opacity="0.07" stroke="#B45309" stroke-width="1.5" stroke-dasharray="10 7"/>
    <text x="430" y="524" font-size="16" fill="#B45309" text-anchor="middle" font-weight="600">50 м · зернохранилище</text>
    <text x="430" y="400" font-size="16" fill="#B45309" text-anchor="middle" font-weight="600">100 м · элеватор</text>
    <text x="430" y="240" font-size="16" fill="#B45309" text-anchor="middle" font-weight="600">300 м · склад минеральных удобрений свыше 50 т</text>
  </g>

  <!-- Жилая застройка -->
  <g>
    <rect x="180" y="660" width="500" height="80" rx="10" fill="#F5F7FA" stroke="#E3E8EF" stroke-width="1.5"/>
    <text x="430" y="695" font-size="18" fill="#5B6B7F" text-anchor="middle" font-weight="600">Жилая застройка с. Среднебелая</text>
    <text x="430" y="722" font-size="14.5" fill="#8A95A5" text-anchor="middle">разрывы отсчитываются от границы жилой застройки</text>
  </g>

  <!-- Участок -->
  <g transform="rotate(-28 850 380)">
    <path d="M 610 320 L 1150 320 L 1180 350 L 1185 455 L 1140 490 L 820 490 L 780 455 L 640 455 L 605 415 Z"
          fill="#26A69A" fill-opacity="0.12" stroke="#1A237E" stroke-width="4" stroke-linejoin="round"/>
    <text x="900" y="395" font-size="23" fill="#1A237E" text-anchor="middle" font-weight="700">Участок 28:14:010311:1 · 11,07 га</text>
    <text x="900" y="425" font-size="16" fill="#1F7A70" text-anchor="middle">пятно застройки смещается в сторону, удалённую от жилья</text>

    <!-- Охранный коридор ВЛ-10 кВ -->
    <rect x="580" y="240" width="640" height="52" fill="url(#zHatch)" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6 5"/>
    <line x1="580" y1="266" x2="1220" y2="266" stroke="#B45309" stroke-width="2.5"/>
    <text x="900" y="228" font-size="16" fill="#B45309" text-anchor="middle" font-weight="600">охранный коридор ВЛ-10 кВ · 10 м в каждую сторону, ширина 20 м</text>

    <!-- Полоса отвода -->
    <line x1="560" y1="540" x2="1240" y2="540" stroke="#0F1B2D" stroke-width="5"/>
    <g stroke="#0F1B2D" stroke-width="2.5">
      <line x1="590" y1="530" x2="590" y2="550"/><line x1="650" y1="530" x2="650" y2="550"/>
      <line x1="710" y1="530" x2="710" y2="550"/><line x1="770" y1="530" x2="770" y2="550"/>
      <line x1="830" y1="530" x2="830" y2="550"/><line x1="890" y1="530" x2="890" y2="550"/>
      <line x1="950" y1="530" x2="950" y2="550"/><line x1="1010" y1="530" x2="1010" y2="550"/>
      <line x1="1070" y1="530" x2="1070" y2="550"/><line x1="1130" y1="530" x2="1130" y2="550"/>
      <line x1="1190" y1="530" x2="1190" y2="550"/>
    </g>
    <text x="900" y="575" font-size="15.5" fill="#5B6B7F" text-anchor="middle">полоса отвода железной дороги</text>
  </g>

  <!-- Легенда -->
  <g font-size="15.5" fill="#0F1B2D">
    <rect x="1000" y="600" width="330" height="128" rx="10" fill="#F5F7FA" stroke="#E3E8EF"/>
    <line x1="1024" y1="630" x2="1064" y2="630" stroke="#1A237E" stroke-width="4"/>
    <text x="1078" y="635">граница участка</text>
    <rect x="1024" y="652" width="40" height="14" fill="url(#zHatch)" stroke="#B45309" stroke-width="1"/>
    <text x="1078" y="665">охранный коридор ВЛ</text>
    <line x1="1024" y1="694" x2="1064" y2="694" stroke="#B45309" stroke-width="1.5" stroke-dasharray="8 6"/>
    <text x="1078" y="699">санитарные разрывы 50 / 100 / 300 м</text>
  </g>

  <text x="70" y="740" font-size="14" fill="#8A95A5">Санитарные разрывы — СанПиН 2.2.1/2.1.1.1200-03. Охранные зоны — Правила установления охранных зон объектов электросетевого хозяйства.</text>
</svg>
